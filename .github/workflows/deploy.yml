# Despliega la app a GitHub Pages cada vez que se hace push a "main".
# Antes de usarlo: en el repositorio, Settings -> Pages -> Source = "GitHub Actions".
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # El base-href toma el nombre del repositorio (https://usuario.github.io/<repo>/)
      - run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"
      # GitHub Pages no entiende las rutas de Angular (/casas/123). Con una copia
      # de index.html como 404.html, recargar o abrir un enlace directo funciona.
      - run: cp dist/tec-viviendas/browser/index.html dist/tec-viviendas/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/tec-viviendas/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
